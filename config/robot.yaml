# ============================================================================
# CONFIGURAÇÃO DO ROBÔ
#
# Isto é o painel de controlo. Podes mudar qualquer valor aqui e ver o que
# acontece — não parte nada. Se te enganares, apaga a linha e volta a correr.
# ============================================================================

# O nome do robô. Escolhido pela Lara.
nome: "Lylla"

# ----------------------------------------------------------------------------
# MOTORES
# ----------------------------------------------------------------------------
motores:
  # COMO É QUE O PI MANDA NAS RODAS:
  #   mbot2   → o mBot2 fica INTEIRO e fala com o Pi por um cabo USB. O shield
  #             conta os encoders em hardware e mantém a velocidade em malha
  #             fechada, por isso o `andar_cm` MEDE em vez de cronometrar.
  #   tb6612  → caminho antigo guardado para referência. Não o montar.
  ligacao: mbot2
  velocidade: 0.5           # 0 a 1. Acima de 0.6 ele bate com força nos rodapés.
  velocidade_max: 0.6       # limite de segurança — o código nunca passa daqui
  compensacao_esq: 1.00     # se ele fugir para a direita, sobe este número
  compensacao_dir: 1.00     # se ele fugir para a esquerda, sobe este
  timeout_s: 3.0            # nenhum comando dura mais que isto sem ser renovado

  # ⚠️ Os três de baixo só valem com `ligacao: tb6612`. Com o mBot2 não são
  #    usados: a velocidade é comandada em RPM e a distância é lida das rodas,
  #    portanto não há nada para compensar nem para cronometrar.
  compensacao_esq_tb6612: 1.00
  compensacao_dir_tb6612: 1.00
  tempo_90_graus: 0.55      # segundos para rodar 90°
  cm_por_segundo: 18.0      # medido à velocidade 0.5

# ----------------------------------------------------------------------------
# O mBot2 POR USB — o robô inteiro, sem cortar cabos
#
# Medido em 01/09/2026 com scripts/spike_mbot2.py: pedir custa 51 ms (só ao
# CyberPi) ou 102 ms (se atravessar o shield); subscrever custa ~0. Por isso o
# driver subscreve os encoders, o giroscópio e os ultrassons no arranque.
#
# ⚠️ A paragem atual passa por este cabo. O corte físico de movimento com o
#    mBot2 intacto ainda precisa de ser desenhado e testado.
# ----------------------------------------------------------------------------
mbot2:
  porta: ""                 # vazio = procura sozinho (prefere /dev/serial/by-id)
                            # A placa ESP32 antiga já foi encontrada. O conversor
                            # USB-série ainda não foi identificado. Se também criar
                            # /dev/ttyUSB*, fixa aqui o by-id do CyberPi.
  diametro_roda_cm: 8.0     # rodas do mBot2. Muda a régua toda da odometria.
  rpm_max: 86.0             # a que RPM corresponde velocidade 1.0
                            # 86 RPM ≈ 36 cm/s, logo velocidade 0.5 ≈ 18 cm/s
                            # (o shield aguenta 200, mas dentro de casa não)
  inverter_direita: false   # os motores do mBot2 estão montados em espelho, MAS
                            # a Makeblock diz que o `drive_speed` já sincroniza
                            # os dois — por isso começamos por confiar nele.
                            # ⚠️ Se ao mandar `andar(30)` ele rodar no sítio, ou
                            #    se a Lylla avisar que as rodas contaram sentidos
                            #    contrários, põe `true` aqui. É o único sítio.
  espera_s: 20.0            # quanto esperar pelo CyberPi antes de desistir

# ----------------------------------------------------------------------------
# SEGURANÇA — não mexer sem falar com o pai
# ----------------------------------------------------------------------------
seguranca:
  distancia_min_cm: 25      # abaixo disto, para
  distancia_aviso_cm: 40    # abaixo disto, abranda
  verificar_precipicio: false  # só ligar depois de integrar e validar o sensor RGB

# ----------------------------------------------------------------------------
# PROTÓTIPO HUB75
#
# A escolha final continua aberta entre HUB75 e OLED. Estes valores só servem
# para testar o protótipo com ESP32. As expressões vivem em
# config/expressoes.yaml.
# ----------------------------------------------------------------------------
cara:
  porta: "/dev/ttyUSB0"     # onde está o ESP32. Confirmar com:
                            #   ls /dev/ttyUSB* /dev/ttyACM*
                            # (alguns ESP32 aparecem como ttyACM0)
  baud: 115200
  brilho: 40                # 0 a 100. Acima de 60 é ofuscante num quarto,
                            # e o painel aquece e come mais corrente.
  expressao_inicial: "a_dormir"

# ----------------------------------------------------------------------------
# MODO SECRETÁRIA — o robô como companheiro, em cima da mesa da Lara
#
# É aqui que ele passa a maior parte do tempo. Repara em quem chega, segue com
# os olhos, e entretém-se sozinho quando ninguém lhe liga. Nunca fala primeiro:
# para conversar é preciso a palavra-chave.
#
# ⚠️ SEGURANÇA: em cima de uma secretária, uma queda de 75 cm parte o robô.
#    Os sensores de precipício deixam de ser "bom ter" e passam a ser a coisa
#    que impede o projeto de acabar num dia. Testar SEMPRE antes de o pôr na
#    mesa — `python scripts/test_sensors.py`.
# ----------------------------------------------------------------------------
secretaria:
  ativa: true
  andar: false              # só ligar depois de validar a proteção contra bordas
  velocidade_max: 0.25      # ⚠️ TETO ABSOLUTO na secretária. Aplica-se a TUDO,
                            # incluindo ao que o LLM mandar fazer.
  duracao_voltinha_s: 0.35

  # Quanto custa olhar. Estes três números são o orçamento de CPU do robô.
  fps_deteccao: 10          # vezes por segundo que procura uma cara
  resolucao_deteccao: [320, 240]   # ⚠️ NÃO é a mesma de faces.resolucao.
                            # Para saber ONDE está uma cara chega isto; para
                            # saber QUEM É usa-se a imagem grande.
  reidentificar_s: 4.0      # de quanto em quanto tempo confirma quem é
  salto_outra_pessoa: 0.35  # se a cara saltar mais do que isto, reconhece já
  frames_para_ausencia: 8   # ⚠️ quantas imagens seguidas sem cara antes de
                            # dizer "não está lá ninguém". Sem isto, o robô
                            # cumprimentava a Lara de cada vez que ela olhasse
                            # para o caderno.
  area_perto: 0.10          # cara a ocupar 10% da imagem = encostada ao robô

  # Comportamento
  segundos_ate_atividade: 90     # sozinho há tanto tempo → arranja que fazer
  intervalo_atividades_s: 45     # e depois faz uma coisa de X em X segundos
  arrefecimento_saudacao_s: 900  # ⚠️ 15 min. Cumprimentar de cada vez que ela
                                 # se levanta para ir buscar água é irritante,
                                 # não é simpático.

# ----------------------------------------------------------------------------
# MODO SEGUIR — andar atrás da Lara pela casa (FASE 16)
#
# ⚠️ VEM DESLIGADO. Ler a secção D17 do plano antes de o ligar: há uma conta
#    de segurança (a que velocidade os sensores de precipício ainda travam a
#    tempo) que decide se isto é aceitável em casa com escadas.
#
# A velocidade máxima aqui NÃO é conforto. É o resultado dessa conta:
#   distância que o sensor vê à frente das rodas ≈ 5 cm
#   menos a travagem de um robô de 2 kg .......... ≈ 5 cm
#   sobra para a reação ......................... ≈ 0 cm  → margem nenhuma
# Por isso: velocidade baixa, e um segundo sensor apontado ao chão à frente
# (ver D17) se quisermos ir mais depressa.
# ----------------------------------------------------------------------------
seguir:
  ativo: false              # ⚠️ fase 16. Não ligar antes dos sensores estarem
                            #    montados, calibrados e testados nas escadas.
  velocidade_max: 0.35      # ~40% mais lento que o limite do chão
  area_seguir: 0.055        # cara mais pequena que isto = está longe, acelera
  area_parar: 0.16          # cara maior que isto = já cheguei, paro
  zona_morta: 0.12          # não corrigir a direção dentro disto (senão treme)
  ganho_rotacao: 0.55       # quanto vira por unidade de erro

# ----------------------------------------------------------------------------
# NAVEGAÇÃO — atravessar a casa até uma divisão com nome
#
# A planta desenha-se e o piloto treina-se em docs/escola-de-conducao.html.
# Saem de lá dois ficheiros, e é só isso que este bloco aponta.
#
# ⚠️ VEM DESLIGADO no robô a sério, pela mesma razão do `seguir`: um robô a
#    atravessar a casa sozinho passa por sítios que ninguém verificou. Em
#    ROBO_SIMULAR=1 anda sempre — lá não há nada para partir.
#
# A explicação toda (incluindo porque é que ela se «perde») está em
# docs/navegacao.md.
# ----------------------------------------------------------------------------
navegacao:
  ativo: false              # ⚠️ ligar só depois dos sensores de precipício
                            #    montados, calibrados e testados nas escadas
  casa: "data/casa.json"
  piloto: "data/piloto.json"

  velocidade_max: 0.45      # teto próprio, mais baixo que o do chão: ela anda
                            # às cegas para os lados (ver feixes_reais)

  # Quantos sensores de distância existem MESMO no robô, virados para a
  # frente. Hoje é um: o ultrassons. O piloto treinado com cinco feixes
  # continua a funcionar — os quatro que faltam recebem "não vejo nada" —
  # mas ele passa ao lado de coisas que não vê, e o arranque avisa disso.
  # Dois VL53L1X nos cantos (~12 €) põem isto a 3.
  feixes_reais: 1

  # ⚠️ O NÚMERO MAIS IMPORTANTE DESTE BLOCO.
  # Ela sabe onde está a somar o que mandou as rodas fazer — não tem GPS. O
  # erro acumula-se, e a partir daqui a planta deixa de servir: ela julga-se
  # à porta e está meio metro ao lado. Quando passa disto, PARA e pergunta
  # onde está, em vez de continuar convencida contra o rodapé.
  # 55 cm ≈ dois terços de uma porta. Subir isto é trocar segurança por
  # alcance, e dá exatamente o que se pede: mais viagens acabadas, e mais
  # embates. A solução a sério são os encoders das rodas (fase futura).
  deriva_maxima_cm: 55

  passos_encravado: 60      # 6 s a rodar sem sair do sítio = desiste

  # ----------------------------------------------------------------------
  # A MEMÓRIA DO ESPAÇO — o que ela vai aprendendo com o ultrassom
  #
  # A planta sabe as PAREDES; isto aprende a MOBÍLIA (o sofá, o cesto da
  # roupa, a caixa que ficou no corredor). Cada leitura soma evidência a
  # cada quadrado: visto muitas vezes conta para a rota, visto duas não.
  # Ver robot/navigation/memoria_espaco.py e docs/navegacao.md.
  # ----------------------------------------------------------------------
  mapear: true
  mapa: "data/mapa.json"

  # ⚠️ SÓ SE APRENDE COM A POSIÇÃO BOA. Mapear com a posição errada desenha
  #    a mesma parede duas vezes, meio metro ao lado — e um mapa borrado é
  #    pior do que mapa nenhum. Acima desta deriva ela continua a andar, mas
  #    deixa de tomar notas até se voltar a encontrar.
  deriva_para_mapear: 25
  mapear_ate_cm: 150          # ⚠️ e só até 1,5 m depois do último varrimento
                              #    que correu bem. A conta da deriva é otimista;
                              #    ter emparelhado com o mapa há pouco caminho
                              #    é a única confirmação a sério que existe

  segundos_entre_mapas: 2.0   # de quanto em quanto tempo a mobília aprendida
                              # volta a entrar no cálculo da rota (é um
                              # Dijkstra de cada vez: barato, mas não de graça)

  # O varrimento: parar, dar uma volta lenta a medir, e comparar com o mapa
  # para descobrir onde está mesmo. É o que substituiu o «perdi-me».
  velocidade_varrer: 0.32   # uma volta inteira em ~7 s. Mais depressa dá menos
                            # medidas por grau; mais devagar passa a viagem a rodar
  metros_entre_varrimentos: 2.0   # ⚠️ verificar CEDO. Esperar por estar perdida
  deriva_para_varrer: 20          #    não funciona: quando a conta dispara, o
                                  #    erro verdadeiro já pode estar fora do
                                  #    que o emparelhamento procura.
                                  #
                                  # A regra: este número é UM QUARTO do que o
                                  # varrimento procura à volta (90 cm), porque
                                  # o erro verdadeiro chega a ser o triplo do
                                  # calculado quando uma roda patina.

  # Às escondidas (robot/navigation/procurar.py)
  segundos_a_espreitar: 6.0   # quanto tempo dá a volta sobre si ao chegar a
                              # uma divisão. A câmara vê ~60°: menos de uma
                              # volta inteira é procurar de olhos meio fechados
  velocidade_espreitar: 0.22  # devagar de propósito — o detetor de caras corre
                              # a 10 imagens por segundo e precisa de as ver

# ----------------------------------------------------------------------------
# CARAS
# ----------------------------------------------------------------------------
faces:
  limiar: 0.45              # maior = mais exigente.
                            # O valor oficial do OpenCV é 0.363. Subimos porque
                            # é muito pior chamar "Lara" a uma visita do que
                            # dizer "não te conheço" à Lara.
  fotos_por_pessoa: 8
  segundos_por_pose: 2.0    # tempo entre o robô DIZER a pose e tirar a foto
                            # (o registo pela voz — ver perception/registo.py)       # quantas fotos tirar ao registar alguém
  resolucao: [640, 480]     # maior = mais lento, não necessariamente melhor

# ----------------------------------------------------------------------------
# VOZ
# ----------------------------------------------------------------------------
# ----------------------------------------------------------------------------
# A LÍNGUA DO ROBÔ
# ----------------------------------------------------------------------------
# "pt" fala português de Portugal · "en" fala inglês e mais nada.
#
# O modo inglês não é só a voz: muda também o system prompt do LLM, porque uma
# voz inglesa a ler texto português sai estropiada (o fonemizador é en-us). Em
# inglês vale a pena pôr voz.idioma em "auto" — assim a Lara pode falar-lhe em
# português e ela responde à mesma em inglês.
#
# As experiências antigas com vozes locais continuam nos scripts, mas a
# montagem atual usa a voz produzida pelo mac mini.
# ⚠️ A VOZ É INGLESA (GLaDOS, fonemizador en-us). As frases fixas do robô
#    (robot/voice/frases.py, ferramentas, navegação) já são SÓ em inglês;
#    pôr "pt" aqui só mudava o LLM — e o que ele dissesse sairia estropiado.
lingua: "en"          # a Lara está a aprender inglês e gosta da GLaDOS

voz:
  # A síntese corre no mini. O Pi só reproduz o WAV recebido ou guardado em cache.
  motor: "mac"

  # A VOZ VEM DO MINI. Vazio = usa o `cerebro.url` acima (+ /v1/falar), que é
  # o que se quer. Só se preenche isto para apontar a voz a OUTRA máquina que
  # não a do cérebro. O Pi guarda cada WAV em data/voz/ e volta a usá-lo sem
  # rede nenhuma — é isso que o faz falar com o mini desligado.
  servidor: ""
  voz_mac: "glados"                  # o nome da voz NO MINI (lá corre o Piper)
                                     # ⚠️ "Joana" é uma voz do `say` do macOS e
                                     # o mini já não usa o `say` — pedir-lha dá
                                     # erro, o Pi cai para o espeak-ng e, sem
                                     # ele instalado, fica mudo.
  tempo_limite_s: 5                  # a partir daqui desiste e usa o recurso
  velocidade_fala: 1.0               # 0.8 fala mais devagar; 1.2 mais depressa
  volume: 1.0                        # 0.0 a 1.0. Aplicado às amostras, não ao
                                     # amixer: a placa I2S do googlevoicehat não
                                     # expõe controlo de volume nenhum.

  # Não há modelos de fala nem de transcrição no Pi.
  modelo_tts: ""
  idioma: "auto"
  palavra_chave: "ola_robo"
  limiar_palavra_chave: 0.6          # subir se ele acordar sozinho
  # QUANDO É QUE A FRASE ACABOU. As crianças fazem pausas a meio («what is…
  # hmm… classes?»), e com 1 s fixo o robô ia responder a meia pergunta.
  # A pausa que fecha a frase é maior no princípio, enquanto ela arruma a
  # ideia. As luzes mostram esta conta: verde → amarelo → laranja → roxo.
  silencio_para_parar_s: 1.2         # a pausa normal que fecha a frase
  silencio_extra_inicio_s: 0.8       # + isto enquanto ela falou menos de…
  fala_curta_s: 1.5                  # … este tempo
  espera_inicio_s: 6.0               # quanto espera que ela COMECE a falar
  max_frase_s: 15.0                  # uma frase nunca passa disto

  # O MICROFONE I2S OCUPA UM SLOT DOS DOIS. O `L/R` do MEMS escolhe qual; o
  # outro fica vazio. Pedir um canal só à ALSA mistura os dois e o sinal cai
  # para um décimo (medido: 0,0085 contra 0,0893). Lê-se estéreo e escolhe-se.
  #   L/R à massa  → canal 0     ·  L/R a 3V3 → canal 1
  # Com uma placa USB mono (o reSpeaker), voltar a 1 e 0.
  canais_microfone: 2
  canal_microfone: 0

# ----------------------------------------------------------------------------
# O CÉREBRO — o mac mini que ouve, pensa e fala
#
# É UM endereço só. O que corre lá dentro (transcrição, LLM e voz)
# decide-se no config/cerebro.yaml, no próprio mini — o robô não precisa de
# saber. Trocar de modelo não obriga a mexer em nada aqui.
#
# O mini e a Lylla estão os dois na mesma rede TAILSCALE, e é por aí que
# falam. Isso dá duas coisas que o mDNS de casa não dava:
#
#   · o nome `mini` funciona SEMPRE — em casa, em casa da avó, ou com o robô
#     ligado ao telemóvel. Não depende do router nem do `.local`.
#   · o tráfego vai cifrado ponta a ponta, o que interessa quando o que passa
#     no fio é a voz de uma criança.
#
# ⚠️ Continua a ser rede local quando estão na mesma casa: o Tailscale liga os
#    dois diretamente, não passa por servidor nenhum. A latência é a do WiFi.
# ----------------------------------------------------------------------------
cerebro:
  url: "http://mini:8420"

  # Escutar em contínuo: o áudio vai para o mini ENQUANTO a Lara fala, e ele
  # vai transcrevendo. Poupa o tempo todo de transcrever, que antes só
  # começava depois de ela se calar. Ver docs/AI-config.md.
  # A false, volta ao /v1/turno (grava tudo, envia no fim).
  #
  # ⚠️ DESLIGADO A 17/09/2026, com medição. O MESMO ficheiro de 10 s:
  #      lote       → «Olá! 1, 2, 3, 4, 5, 6 Agora estou a falar para a
  #                   Glaila.»   em 297 ms
  #      contínuo   → «Yeah.» · «I'm not sure.» · vazio   em 35 861 ms
  #    Não é o microfone nem o modelo — é o caminho incremental. A suspeita é
  #    o tamanho dos bocados: mandamos 80 ms (o que o microfone dá) e o
  #    descodificador TDT com contexto (256, 256) precisa de mais. Juntar os
  #    bocados até ~1 s antes do add_audio é o que há para experimentar.
  #    Enquanto não estiver medido, fica em false: perde-se a sobreposição
  #    (ela só começa a pensar quando tu te calas), ganha-se a transcrição.
  escutar_em_directo: false

  # Os tempos de espera. Passado isto, o robô desiste e diz alguma coisa em
  # vez de ficar parado — nunca há um silêncio sem explicação.
  timeout_saude_s: 2        # a pergunta "estás aí?"
  timeout_ligar_s: 3        # para ABRIR a ligação (não para a resposta toda)
  timeout_turno_s: 60       # um turno completo, com o modelo a escrever
  timeout_ouvir_s: 20       # só a transcrição
  timeout_falar_s: 10       # só uma frase sintetizada

# O QUE O ROBÔ *NÃO* TEM
#
# Não há aqui nem Whisper nem Ollama. Quem ouve e quem pensa é o mini, e mais
# ninguém. Com o mini desligado o robô não percebe o que lhe dizem. Pode tocar
# um aviso que já esteja em cache. A visão e o reconhecimento de pessoas
# continuam no Pi, mas nenhuma nova ordem falada pode ser transcrita.
#
# É uma escolha, não um esquecimento: um Whisper que perceba português no Pi 5
# fica mais lento que o tempo real, e são 500 MB no cartão SD para um caso que
# o Tailscale torna raro.

# ----------------------------------------------------------------------------
# BRAÇOS — 5 servos no PCA9685 em 0x41, a 50 Hz
#
# LARA: os limites (min/max) são os ângulos em que o braço ainda NÃO bate no
# corpo. Descobre-os na fase 8, movendo cada servo devagar. O robô nunca passa
# destes números, mesmo que o código peça — é o que impede a mecânica de partir.
# ----------------------------------------------------------------------------
bracos:
  ativo: false              # só ligar depois de instalar e limitar os servos
  i2c: 0x41                 # (o endereço vive SÓ aqui — ver nota na secção i2c)
  us_min: 500               # microssegundos para 0°
  us_max: 2500              # microssegundos para 180°
  intervalo_s: 0.08         # ⚠️ pausa entre juntas ao fazer uma pose.
                            # NÃO É ESTÉTICA, É ELÉTRICA: dois DS3218 a
                            # arrancar juntos puxam ~6 A e o regulador dá 5 A.
                            # Escalonar mantém o pico dentro da fonte.
  juntas:
    ombro_esq:    {canal: 0, min: 10,  max: 170}   # DS3218
    cotovelo_esq: {canal: 1, min: 10,  max: 170}   # MG90S
    ombro_dir:    {canal: 2, min: 10,  max: 170}   # DS3218
    cotovelo_dir: {canal: 3, min: 10,  max: 170}   # MG90S
    garra:        {canal: 4, min: 40,  max: 110}   # MG90S
                            # ⚠️ o 'min' da garra NÃO deve ser o limite
                            #    mecânico do servo — ela fecha com força
                            #    suficiente para magoar um dedo pequeno

# ----------------------------------------------------------------------------
# BRILHO
#
# O desenho original usava os canais livres do PCA9685 dos motores (0x40). Esse
# controlador saiu da construção quando o mBot2 ficou inteiro, e pedir-lhe
# brilho dava erro de I2C a cada volta do ciclo principal.
#
# Agora o brilho sai pelos 5 LEDs RGB do CyberPi, que já estão lá e já falam
# connosco por USB. São uma tira só: os grupos "base" e "peito" partilham-na,
# e o mais aceso manda. Voltar ao desenho antigo é pôr motor: pca9685.
# ----------------------------------------------------------------------------
brilho:
  motor: "mbot2"            # mbot2 | pca9685
  canais:
    base: 6                 # anel na base — onde o Astro teria os pés
    peito: 7                # o painel do peito
  repouso: 0.35             # brilho quando o robô está apenas ligado

# ----------------------------------------------------------------------------
# ENERGIA — leitura da bateria pelo ADS1115
# ----------------------------------------------------------------------------
energia:
  ativa: false              # o ADS1115 ainda não faz parte do POC atual
  canal_adc: 0
  divisor: 5.545            # (R1+R2)/R2 com R1=100k e R2=22k
                            # ⚠️ CALIBRAR na fase 7: mede com o multímetro e
                            #    ajusta este número até a leitura bater certo
  aviso_pct: 20             # abaixo disto, o robô diz que tem fome
  critico_pct: 5            # abaixo disto, desliga-se sozinho
  leituras_criticas: 3      # leituras críticas SEGUIDAS antes de desligar.
                            # Uma só não chega: a tensão cai 0,3-0,5 V quando
                            # os servos arrancam, e isso não é bateria fraca.

# ----------------------------------------------------------------------------
# PINOS DO DESENHO ANTIGO
#
# Estes pinos pertencem aos sensores externos e ao caminho TB6612. Não estão
# instalados na construção atual. O mBot2 usa USB.
# ----------------------------------------------------------------------------
pinos:
  pca_oe: 25                # só vale para o caminho TB6612 antigo
                            # não corta o movimento do mBot2
  ultrassons_trigger: 23
  ultrassons_echo: 24
  precipicio_esq: 17
  precipicio_centro: 27
  precipicio_dir: 22
i2c:
  motores: 0x40             # caminho TB6612 antigo, inativo
  tof: 0x29                 # VL53L1X
  ads1115: 0x48             # tensão da bateria
  # NOTA: o endereço dos servos NÃO está aqui — vive em bracos.i2c, que é
  # onde o arms.py o vai buscar. Um valor em dois sítios é um valor que fica
  # dessincronizado.

# ----------------------------------------------------------------------------
# ROTINAS — o que o robô faz em cada momento da conversa (robot/rotinas.py)
#
# Cada momento é uma lista de enriquecimentos pequenos: luzes, sons, caras e
# «hmm». Descomenta um e muda a lista para experimentar — por exemplo, tirar o
# bip de «estou a ouvir», ou pôr os olhos em coração quando ela acaba de falar.
# Nomes que existem: python -c "from robot import rotinas; print(rotinas.conhecidos())"
# ----------------------------------------------------------------------------
# rotinas:
#   acordar:  [luz.a_ouvir, olhos.atento, som.a_ouvir]
#   ouvi:     [som.ouvi, luz.a_pensar, olhos.a_pensar]
#   a_pensar: [voz.hmm]
#   a_pensar_muito: [voz.deixa_pensar]
#   a_falar:  [luz.a_falar]
#   acabei:   [luz.repouso]
