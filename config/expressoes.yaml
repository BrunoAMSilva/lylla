# ============================================================================
# AS CARAS DO ROBÔ
#
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  LARA: este ficheiro é teu.                                              ║
# ║                                                                          ║
# ║  Cada expressão são NÚMEROS que descrevem a forma dos olhos. Muda um     ║
# ║  número, grava, e o robô muda de cara — não é preciso reprogramar o      ║
# ║  ESP32 nem reiniciar nada.                                               ║
# ║                                                                          ║
# ║  Os nomes dos parâmetros são os MESMOS do bot-face no browser: abre o    ║
# ║  demo, mexe nos sliders até gostares, e copia os números para aqui.      ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# O QUE CADA NÚMERO FAZ
#
#   rx          largura do olho          (2 a 6)
#   ry          altura do olho           (2 a 7)
#   abertura    1 = bem aberto · 0 = fechado
#   redondeza   0 = quadrado · 1 = círculo
#   rotacao     inclinação em radianos   (-0.5 a 0.5) — é isto que faz "zangado"
#   arco        curva o olho para cima   (0 a 1) — é isto que faz "contente"
#   cheio       1 = maciço · 0 = só contorno
#   cor         a cor deste estado, em hexadecimal
#
# ⚠️ O robô move-se SUAVEMENTE de uma cara para a outra — o ESP32 faz o morph
#    sozinho. Não é preciso desenhar os passos intermédios.

# Cor por omissão: o ciano do Astro (o mesmo do teu demo, [0.21, 0.88, 1.0])
cor_base: "36E0FF"

# Quanto tempo demora a passar de uma cara para outra, em milissegundos
morph_ms: 180

expressoes:

  neutro:
    rx: 3.2
    ry: 4.2
    abertura: 1.0
    redondeza: 0.55

  feliz:
    rx: 3.2
    ry: 4.4
    arco: 0.62          # ← é o arco que faz o "sorriso" dos olhos
    redondeza: 0.5

  surpreso:
    rx: 3.6
    ry: 5.1
    redondeza: 0.92

  a_dormir:
    rx: 3.2
    ry: 4.3
    abertura: 0.34

  zangado:
    rx: 3.2
    ry: 3.4
    rotacao: 0.34       # ← a inclinação faz a sobrancelha
    abertura: 0.9
    arco: 0.12

  a_piscar:
    rx: 3.2
    ry: 4.2
    abertura: 0.12

  piscadela:
    rx: 3.2
    ry: 4.2
    abertura_dir: 0.08  # só o olho direito fecha

  triste:
    rx: 3.0
    ry: 3.8
    rotacao: -0.22
    arco: -0.35
    cor: "5B8FD6"       # um azul mais frio e apagado

  a_pensar:
    rx: 3.2
    ry: 4.2
    olhar_x: 0.5        # desvia os olhos para o lado
    olhar_y: -0.4       # e para cima
    abertura: 0.8

  a_procurar:
    rx: 3.0
    ry: 4.0
    olhar_x: 0.9
    abertura: 0.9

  # ---------------------------------------------------------------------------
  # Formas especiais — não são olhos, são desenhos
  # ---------------------------------------------------------------------------

  coracao:
    forma: "coracao"    # o ESP32 desenha um coração a bater
    cor: "FF3B5C"       # ⚠️ AQUI o vermelho é intencional e certo:
                        #    o Astro mostra corações vermelhos nos olhos.
                        #    (O que sinaliza inimigos é o olho INTEIRO vermelho,
                        #     não um ícone colorido.)

  contente:
    forma: "coracao"
    cor: "FFB43B"       # coração dourado, para quando ele fica MESMO contente

  a_arrancar:
    forma: "arranque"   # a animação de boot

  sem_rede:
    rx: 3.0
    ry: 3.0
    abertura: 0.5
    cor: "8A97A4"       # cinzento: o cérebro grande está a dormir

  bateria_fraca:
    rx: 3.0
    ry: 3.6
    arco: -0.2
    cor: "FFB43B"       # âmbar, como um aviso de painel de carro

# ============================================================================
# ANIMAÇÕES — sequências de (expressão, segundos)
#
# O piscar automático e a "respiração" NÃO estão aqui: são comportamentos que
# o ESP32 faz sozinho, sem ninguém mandar. É isso que dá vida ao robô.
# ============================================================================
  # ── Caras do modo secretária ──────────────────────────────────────────
  # Só existem para as ATIVIDADES: o que ele faz quando ninguém lhe liga.
  # A lição do Eilik é esta — ter coisas para fazer vale mais do que ver.

  entediado:
    rx: 3.0
    ry: 2.6           # olhos meio fechados, a escorregar
    abertura: 0.55
    olhar_y: 0.35     # a olhar para baixo, para o tampo da secretária
    redondeza: 0.5

  a_bocejar:
    rx: 3.4
    ry: 5.6           # muito abertos, como quem estica
    abertura: 1.0
    redondeza: 0.75

  sonolento:
    rx: 3.0
    ry: 1.6
    abertura: 0.3
    olhar_y: 0.2
    redondeza: 0.5

  atento:
    rx: 3.4
    ry: 4.8
    abertura: 1.0
    redondeza: 0.6

animacoes:

  acordar:
    - [a_arrancar, 1.2]
    - [a_dormir, 0.3]
    - [a_piscar, 0.15]
    - [surpreso, 0.35]
    - [feliz, 0.0]

  adormecer:
    - [neutro, 0.4]
    - [a_piscar, 0.3]
    - [neutro, 0.3]
    - [a_dormir, 0.0]

  festejar:
    - [feliz, 0.25]
    - [coracao, 0.6]
    - [surpreso, 0.2]
    - [feliz, 0.0]

  a_pensar:
    - [a_pensar, 0.4]
    - [a_procurar, 0.4]
    - [a_pensar, 0.0]

  varrer:
    - [a_procurar, 0.35]
    - [neutro, 0.25]
    - [a_procurar, 0.35]
    - [neutro, 0.0]

  gosto_de_ti:
    - [surpreso, 0.2]
    - [coracao, 1.4]
    - [feliz, 0.0]

  bocejar:
    - [sonolento, 0.5]
    - [a_bocejar, 0.7]
    - [a_piscar, 0.15]
    - [sonolento, 0.4]
    - [neutro, 0.0]

  entediado:
    - [entediado, 1.0]
    - [a_piscar, 0.12]
    - [entediado, 0.9]
    - [a_procurar, 0.5]
    - [neutro, 0.0]

  reparar_em_alguem:
    - [atento, 0.35]
    - [surpreso, 0.3]
    - [contente, 0.0]
